<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><style>text{font-family:Inter,Arial,sans-serif;fill:#243348;font-size:18px}.title{font-size:21px;font-weight:700}.small{font-size:16px;fill:#526276}.edge{stroke:#526276;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#f1f5f9;stroke:#c4ced9;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526276"/></marker></defs><title id="title">Dreamer learns a policy in latent imagination</title><desc id="desc">Real replay trains a world model and supplies inferred starting states. Actor actions drive imagined latent transitions and reward predictions. Imagined returns train the actor and critic, whose policy then acts in the real environment.</desc>
<rect class="box" x="10" y="25" width="222" height="150" rx="12"/><text class="title" x="28" y="55">Real experience</text><text x="28" y="88">observations</text><text x="28" y="115">actions and rewards</text><text class="small" x="28" y="148">replay trains the model</text>
<path class="edge" d="M236 93H294"/><text class="small" x="244" y="70">infer</text>
<rect x="300" y="25" width="424" height="150" rx="12" fill="#eef3fe" stroke="#b5c7ec"/><text class="title" x="318" y="55">Imagine in the learned model</text><text x="318" y="89">latent state → action → next latent state</text><text x="318" y="120">predict reward; repeat with the actor</text><text class="small" x="318" y="150">future observations are unavailable here</text>
<path class="edge" d="M728 93H778"/>
<rect x="784" y="25" width="206" height="150" rx="12" fill="#edf8f4" stroke="#a8d4c8"/><text class="title" x="802" y="55">Actor + critic</text><text x="802" y="89">prefer good actions</text><text x="802" y="120">estimate returns</text><text class="small" x="802" y="150">learn in imagination</text>
<path class="edge" d="M885 178V214H120V179"/><rect x="285" y="198" width="420" height="32" fill="white"/><text x="300" y="220">Act in the real world; observe and update memory.</text></svg>