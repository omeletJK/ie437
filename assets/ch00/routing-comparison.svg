<svg xmlns="http://www.w3.org/2000/svg" width="880" height="235" viewBox="0 0 880 235" role="img" aria-labelledby="title desc"><style>text{font-family:Inter,Arial,sans-serif;fill:#243348;font-size:18px}.title{font-size:21px;font-weight:700}.small{font-size:16px;fill:#526276}.edge{stroke:#526276;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#f1f5f9;stroke:#c4ced9;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526276"/></marker></defs><title id="title">Two tours through the same unit-square cities</title><desc id="desc">The perimeter route A B C D A has cost 4. The crossing route A C B D A has cost 2 plus 2 square root 2.</desc><rect x="2" y="2" width="426" height="231" rx="14" fill="#edf8f4"/><rect x="442" y="2" width="436" height="231" rx="14" fill="#fff3e8"/><text x="24" y="32" class="title">Perimeter tour</text><text x="464" y="32" class="title">Crossing tour</text><polyline points="75,66 183,66 183,174 75,174 75,66" fill="none" stroke="#087f71" stroke-width="4" stroke-linejoin="round"/><circle cx="75" cy="66" r="6" fill="#087f71"/><text x="55" y="62">A</text><circle cx="183" cy="66" r="6" fill="#087f71"/><text x="191" y="62">B</text><circle cx="183" cy="174" r="6" fill="#087f71"/><text x="191" y="193">C</text><circle cx="75" cy="174" r="6" fill="#087f71"/><text x="55" y="193">D</text><text x="222" y="95" class="small">Each side = 1</text><polyline points="515,66 623,174 623,66 515,174 515,66" fill="none" stroke="#c76b26" stroke-width="4" stroke-linejoin="round"/><circle cx="515" cy="66" r="6" fill="#c76b26"/><text x="495" y="62">A</text><circle cx="623" cy="66" r="6" fill="#c76b26"/><text x="631" y="62">B</text><circle cx="623" cy="174" r="6" fill="#c76b26"/><text x="631" y="193">C</text><circle cx="515" cy="174" r="6" fill="#c76b26"/><text x="495" y="193">D</text><text x="662" y="95" class="small">Each side = 1</text><text x="222" y="130" class="title">Cost = 4</text><text x="662" y="130" class="title">Cost ≈ 4.828</text><text x="24" y="216" class="small">A → B → C → D → A</text><text x="464" y="216" class="small">A → C → B → D → A</text></svg>