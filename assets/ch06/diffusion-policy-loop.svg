<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="title desc"><style>text{font-family:Inter,Arial,sans-serif;fill:#243348;font-size:18px}.title{font-size:21px;font-weight:700}.small{font-size:16px;fill:#526276}.edge{stroke:#526276;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{fill:#f1f5f9;stroke:#c4ced9;stroke-width:1.5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#526276"/></marker></defs><title id="title">Diffusion Policy generation and execution loop</title><desc id="desc">Recent observations condition iterative denoising of an action sequence. Execute its first actions, obtain new observations, and generate a new sequence.</desc>
<rect class="box" x="10" y="45" width="205" height="118" rx="12"/><text class="title" x="28" y="78">Observe</text><text x="28" y="108">Images + robot state</text><text class="small" x="28" y="139">recent history at time t</text>
<path class="edge" d="M217 101H269"/>
<rect x="274" y="25" width="432" height="150" rx="12" fill="#eef3fe" stroke="#b5c7ec"/><text class="title" x="293" y="56">Generate an action sequence</text><text x="294" y="91">noise → denoise → denoise → actions</text><text class="small" x="294" y="122">Condition every denoising step on observations.</text><text class="small" x="294" y="152">Internal diffusion index: k decreases to 0.</text>
<path class="edge" d="M710 101H761"/>
<rect x="766" y="45" width="224" height="118" rx="12" fill="#edf8f4" stroke="#a8d4c8"/><text class="title" x="785" y="78">Execute a prefix</text><text x="785" y="108">First h of H actions</text><text class="small" x="785" y="139">physical time advances</text>
<path class="edge" d="M877 166V211H112V168"/><rect x="300" y="195" width="390" height="32" fill="white"/><text x="319" y="217">Observe again; replace the remaining actions.</text></svg>